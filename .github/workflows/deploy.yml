name: Deploy medioevo.space

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/canon/**'
      - 'public/images/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build site
        run: npm run build

      - name: Smoke test — verify key pages
        run: |
          for page in index tienda registro tour; do
            if [ -f "dist/$page/index.html" ]; then
              echo "  OK $page/index.html"
            else
              echo "  MISSING $page/index.html"
            fi
          done

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=medioevo-site --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          curl -sI https://medioevo.space | head -5
          echo "Deploy complete: https://medioevo.space"
